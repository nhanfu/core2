Id: profile
Name: profile
Label: Profile
Order: 18
Query:
  Global: |
    // js
    (vm) => `select * from "Users" where "Id" = ${vm.id}`
Script: |
  // js
  return {
    Init: async function (com, entity) {
      const ds = await this.client.fetch("Global", 
        { 
          id: this.urlQuery.userId ?? this.Token?.UserId 
        });
      this.entity = ds.data[0];
      this.UpdateView(true)
    },
    ChangePassword: function (btn, entity) {
        this.OpenPopup("change-password-editor", entity);
    }
  }
Icon: fal fa-user
IsMenu: true
EntityId: User
Components:
  - Id: profile.FullPage.1
    FieldName: FullPage
    Order: 1
    ComponentType: Section
    ClassName: scroll-content
    Style: "width: 375px;margin: auto;padding-bottom:10rem;"
    XxlCol: 12
    XxlOuterColumn: 12
    Components:
      - Id: FullPage.General.1
        FieldName: General
        Order: 1
        ComponentType: Section
        ClassName: card-body
        XxlCol: 12
        XxlOuterColumn: 12
        Components:
          - Id: General.DepartmentId.1
            FieldName: DepartmentId
            Order: 1
            ComponentType: Dropdown
            FormatData: "{Name}"
            PlainText: Select data
            Column: 6
            Row: 100
            Label: Department
            ShowLabel: true
            Disabled: true
            Validation: '[{"Rule": "required", "Message": "{0} is required"}]'
            SmCol: 6
            Query: |
              // js
              (vm) => `select ds.* from "MasterData" as ds left join
                "MasterData" ds1 on ds."ParentId" = ds1."Id" where ds1."Name" = 'Department Type',

                select count(ds.id) as total from "MasterData"
                as ds left join "MasterData" ds1 on ds."ParentId" = ds1."Id"
                where  ds1."Name" = 'Department Type'`
            RefName: MasterData
            Template: '[{ "FieldName" : "Name", "Label" : "Name", "ComponentType" : "Input" }]'
          - Id: General.JointDate.5
            FieldName: JointDate
            Order: 5
            ComponentType: Datepicker
            Column: 6
            Label: Joint Date
            ShowLabel: true
            Disabled: true
            SmCol: 6
          - Id: General.Knowledge.6
            FieldName: Knowledge
            Order: 6
            ComponentType: Input
            Column: 6
            Row: 50
            Label: Knowledge
            ShowLabel: true
            SmCol: 6
          - Id: General.CompanyId.7
            FieldName: CompanyId
            Order: 7
            ComponentType: Dropdown
            FormatData: "{Name}"
            PlainText: Select data
            Column: 6
            Row: 100
            Label: Company
            ShowLabel: true
            Disabled: true
            Validation: '[{"Rule": "required", "Message": "{0} is required"}]'
            SmCol: 6
            Query: |
              // js
              (vm) => `select * from "Partner" as ds where "ServiceId" = 5;
                select count(ds."Id") as total from "Partner" as ds where "ServiceId" = 5`
            RefName: Partner
            Template: '[{ "FieldName" : "Name", "Label" : "Name", "ComponentType" : "Input" }]'
          - Id: General.Avatar.0
            FieldName: Avatar
            Order: 0
            ComponentType: FileUpload
            Column: 12
            SmCol: 12
