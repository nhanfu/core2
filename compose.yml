services:

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=crm
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrongPassword123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:16-alpine
    volumes:
      - ./CoreAPI/wwwroot/upload/crm/db:/scripts
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=crm
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=YourStrongPassword123!
    depends_on:
      postgres:
        condition: service_healthy
    command: bash /scripts/init_pg.sh

  coreapi:
    build:
      context: ./CoreAPI
      dockerfile: Dockerfile
    volumes:
      - ./CoreAPI:/app
    ports:
      - "8080:80"
      - "2222:2222"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/lib:/app/lib
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/.env:/app/.env
      - ./frontend/public:/app/public
      - ./frontend/images:/app/images
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    depends_on:
      - coreapi

volumes:
  postgres_data:
