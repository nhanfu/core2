version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: core2-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrongPassword123!
      POSTGRES_DB: crm
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - core2-network

  api:
    build:
      context: ./CoreAPI
      dockerfile: dockerfile-new
    container_name: core2-api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__logistics=Host=db;Port=5432;Database=crm;Username=postgres;Password=YourStrongPassword123!;
      - Tokens__Issuer=http://api.nguyenduyphong.id.vn
      - Tokens__Key=f82bccd1-9ef3-4572-83e3-588dfe04e1b9
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - core2-network
    volumes:
      - api_uploads:/app/wwwroot/upload
      - api_excel:/app/wwwroot/excel

  app:
    build:
      context: ./frontend
      dockerfile: dockerfile-new
    container_name: core2-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - core2-network
    environment:
      - API_URL=http://localhost:8080
      - VITE_API_HOST=http://localhost:8080
      - VITE_API_BASE_URI=http://localhost:8080
      - VITE_API_URL=http://localhost:8080

volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local
  api_excel:
    driver: local

networks:
  core2-network:
    driver: bridge
